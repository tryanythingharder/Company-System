upstream mold_backend {
    server backend:9999;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 12m;

    include /etc/nginx/conf.d/security_headers.inc;

    # 隐藏文件一律 404
    location ~ /\. {
        return 404;
    }

    # 入口页不缓存，保证发版后立即拿到新资源清单
    location = /index.html {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 对外屏蔽的后端路径（前端不使用，只供服务内部调用或运维） ----
    # OAuth 原生端点：外部可用遗留客户端绕过登录限流爆破；本服务内部经 127.0.0.1 直连，不受影响
    location ~* ^/api/admin/(oauth2|token|actuator|druid|v3/api-docs|swagger|doc\.html|webjars|code|client)(/|$) {
        return 404;
    }

    # 上游个人中心接口：改密绕过本系统口令规则与审计（本系统改密走 /admin/auth/password），
    # 资料编辑会 500；check 可无限流校验口令（锁屏未启用）；API Key、社交绑定本系统不使用
    location ~* ^/api/admin/(user/personal/(password|edit)|user/check|user/unbinding|api-key|social/bind)(/|$) {
        return 404;
    }

    # 登录：额外按 IP 限速
    location = /api/admin/auth/login {
        limit_req zone=mold_login burst=10 nodelay;
        proxy_pass http://mold_backend/admin/auth/login;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # SSE 事件流：关闭缓冲、长连接
    location = /api/admin/mold/events/stream {
        proxy_pass http://mold_backend/admin/mold/events/stream$is_args$args;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 其余接口：/api/admin/xxx → backend /admin/xxx
    location /api/ {
        proxy_pass http://mold_backend/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
